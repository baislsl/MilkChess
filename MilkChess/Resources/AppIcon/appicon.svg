<svg width="456" height="456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- 棋子主体（等比例放大后，圆心在画布中心，半径对应缩放） -->
    <circle cx="228" cy="228" r="203.57" stroke="#000000" stroke-width="12.21" fill="#f0e6d2"/>
    <!-- 红色内圈（同样等比例放大，位置和线条宽度适配） -->
    <circle cx="228" cy="228" r="162.86" stroke="#d92b2b" stroke-width="12.21" fill="none"/>
    <!-- 居中的“帥”字（字体大小、位置同步等比例放大） -->
    <text x="228" y="293.14" font-size="228" font-family="SimHei, Microsoft YaHei, sans-serif" font-weight="bold" text-anchor="middle" fill="#d92b2b">帥</text>
</svg>