name: Build

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build-maccatalyst:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.306

      - name: Install .NET MAUI workload
        run: dotnet workload install maui-maccatalyst

      - name: Publish macOS app
        working-directory: MilkChess
        run: dotnet publish -c Release -f net8.0-maccatalyst

      - name: Package macOS app
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent MilkChess/bin/Release/net8.0-maccatalyst/MilkChess.app "artifacts/milkchess-${VERSION#v}-mac-arm64.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/milkchess-*-mac-arm64.zip
